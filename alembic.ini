# alembic.ini · 数据库迁移配置(详设§2.7 SQLAlchemy 2.x + Alembic；开发规范§9.3)
# 迁移脚本可逆(up/down)；先备份后执行；禁止手动改生产库。

[alembic]
# 脚本位置
script_location = migrations
# 版本表名(记录当前迁移版本)
version_table = alembic_version
# 时区
timezone = UTC

# 数据库 URL 占位；实际由 migrations/env.py 从 settings(DATABASE_URL env)注入，
# 此处值仅用于 ``alembic`` 离线命令兜底。
sqlalchemy.url = postgresql+psycopg://fundlens:changeme@postgres:5432/fundlens

# 迁移模板：标准(空 upgrade/downgrade)
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# 迁移脚本生成后自动格式化(开发规范§1.3)
hooks = black,isort
black.type = console_scripts
black.entrypoint = black
black.options = --line-length 100
isort.type = console_scripts
isort.entrypoint = isort
isort.options = --profile black --line-length 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

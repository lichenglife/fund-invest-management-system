# Streamlit 主题与配置(开发规范§10.4 设计令牌；原型§5 金融翠绿专业风)
# 色值与 app/static/style.css 权威源对齐(主色墨绿 #0A6B4A)。

[theme]
primaryColor = "#0A6B4A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0FDF4"
textColor = "#374151"
font = "sans serif"

[server]
runOnSave = true
headless = true

[browser]
gatherUsageStats = false

# pyproject.toml · FundLens（对齐开发规范§1.3 门禁集中管理）
# black/isort/ruff/mypy/pytest 配置在此；编辑器与 CI 共享。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fundlens"
version = "0.1.0"
description = "FundLens · 面向个人投资者/学习者的基金评估与模拟交易系统"
requires-python = ">=3.11"
readme = "README.md"

# ---------------------------------------------------------------------------
# black（§1.3 行宽 100）
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
  | docs
)/
'''

# ---------------------------------------------------------------------------
# isort（profile=black，§1.3）
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["api", "domain", "infra", "schemas", "config", "workers", "app"]
src_paths = ["."]
skip = [".venv", "docs", "build", "dist"]

# ---------------------------------------------------------------------------
# ruff（§1.3：E/F 零容忍，W 需评审）
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", ".venv", "build", "dist"]

[tool.ruff.lint]
# E/F=pyflakes/pycodestyle, I=isort, UP=pyupgrade, B=bugbear, SIM=simplify
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "E501",   # 行长交给 black 管
  "B008",   # FastAPI Depends() 在默认参数常见
]

[tool.ruff.lint.per-file-ignores]
# 前端 Streamlit 脚本：变量命名/魔法值等放宽（§10.2）
"app/**/*.py" = ["B008", "SIM117"]
"app/pages/*.py" = ["E402", "F401"]
"tests/**/*.py" = ["S101"]  # ruff 未装 S，占位无害

# ---------------------------------------------------------------------------
# mypy（§1.3 渐进式 strict；前端用 pyright，§10.1）
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = "(^|/)(app|docs|build|\\.venv|migrations/versions|tests)/"

[[tool.mypy.overrides]]
# 前端 app/ 走 pyright(§10.1)；mypy 放宽 no-any-return 等，避免 import 触发的噪声
module = ["app.*", "app.mock.*"]
disable_error_code = ["no-any-return", "attr-defined", "type-arg", "no-untyped-def"]

[[tool.mypy.overrides]]
# 第三方无 stub 的库放宽（随模块落地补充）
module = [
    "akshare.*",
    "tushare.*",
    "empyrical.*",
    "vectorbt.*",
    "statsmodels.*",
    "chromadb.*",
    "apscheduler.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest（§11 DoD 覆盖率≥80%）
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
  "db: 需真实 PostgreSQL(compose) 的数据库集成测试(无 PG 时 -m 'not db' 跳过)",
  "perf: 性能基准测试(CI 默认 -m 'not perf' 跳过，本地/compose 跑；防退化回归)",
  "live: 真实外部接口烟测(需网络/AkShare；CI 无网络跳过)",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
source = ["api", "domain", "infra", "schemas", "config"]
branch = true
omit = ["app/*", "workers/*", "tests/*"]

[tool.coverage.report]
# 骨架期业务代码极少，门禁 P1 提至 80%（就绪评估 O2 / §9.2）
fail_under = 0
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
